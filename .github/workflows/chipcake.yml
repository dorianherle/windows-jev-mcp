name: ChipCake

on:
  push:
    branches: [chipcake-test]
  workflow_dispatch:

jobs:
  unknown-ui:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt
      - name: Click through ChipCake
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          WINDOWS_JEV_LOGS: ${{ github.workspace }}\runs
          WINDOWS_JEV_LIBRARY: ${{ github.workspace }}\library
        run: python chipcake_test.py
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chipcake-log
          path: |
            chipcake_result.json
            runs
