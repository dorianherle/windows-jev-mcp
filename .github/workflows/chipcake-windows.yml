name: chipcake on hosted windows

on:
  push:
    branches: [chipcake-hosted-windows]

jobs:
  chipcake:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install windows-jev and walk the studio
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv .
          .\.github\chipcake-test.ps1
